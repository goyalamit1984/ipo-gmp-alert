name: IPO GMP Alert

on:
  schedule:
    # 03:30 UTC = 09:00 IST, every day. Add more entries here for
    # multiple checks per day (e.g. GMP can move during the day).
    - cron: "30 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated notified-IPO state file
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run alert check
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python run.py

      - name: Commit updated notified-IPO state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/notified.json
          git diff --cached --quiet || git commit -m "Update notified IPO state [skip ci]"
          git push
